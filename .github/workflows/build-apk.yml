name: Izrada Android APK-a

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build APK (Capacitor)
    runs-on: ubuntu-latest

    steps:
      - name: Preuzimanje koda iz repozitorija
        uses: actions/checkout@v4

      - name: Postavljanje Node.js okruženja
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Postavljanje Java 17 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Priprema webDir (www) i provjera koda
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          fi
          if [ -f "manifest.json" ]; then
            cp manifest.json www/manifest.json
          fi
          python3 - << 'PY'
          import re, subprocess
          with open("www/index.html", "r", encoding="utf-8") as f:
              html = f.read()
          if "</html>" not in html.lower():
              raise RuntimeError("GRESKA: index.html je nepotpun (nedostaje </html>)!")
          scripts = re.findall(r"<script[^>]*>([\s\S]*?)</script>", html, flags=re.IGNORECASE)
          with open("/tmp/check_tv.js", "w", encoding="utf-8") as jf:
              jf.write("\n".join(scripts))
          res = subprocess.run(["node", "--check", "/tmp/check_tv.js"], capture_output=True, text=True)
          if res.returncode != 0:
              raise RuntimeError(f"GRESKA u JavaScript kodu:\n{res.stderr}")
          PY

      - name: Instalacija NPM paketa
        run: npm install

      - name: Generiranje Android projekta i sinkronizacija web aplikacije
        run: |
          npx cap add android
          npx cap sync android

      - name: Integracija bijele TV ikone u Android APK resurse
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin

          cat << 'EOF' > /tmp/icon_full.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <rect width="512" height="512" fill="#000000"/>
            <path d="M182 118 L256 182 L330 118" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="116" y="182" width="280" height="204" rx="42" fill="none" stroke="#ffffff" stroke-width="26"/>
            <polygon points="224,240 224,328 302,284" fill="#ffffff"/>
          </svg>
          EOF

          cat << 'EOF' > /tmp/icon_fg.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <g transform="translate(256,256) scale(0.68) translate(-256,-256)">
              <path d="M182 118 L256 182 L330 118" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="116" y="182" width="280" height="204" rx="42" fill="none" stroke="#ffffff" stroke-width="28"/>
              <polygon points="224,240 224,328 302,284" fill="#ffffff"/>
            </g>
          </svg>
          EOF

          RES_DIR="android/app/src/main/res"
          rm -f "$RES_DIR"/drawable*/ic_launcher*

          rsvg-convert -w 48 -h 48 /tmp/icon_full.svg -o "$RES_DIR/mipmap-mdpi/ic_launcher.png"
          rsvg-convert -w 72 -h 72 /tmp/icon_full.svg -o "$RES_DIR/mipmap-hdpi/ic_launcher.png"
          rsvg-convert -w 96 -h 96 /tmp/icon_full.svg -o "$RES_DIR/mipmap-xhdpi/ic_launcher.png"
          rsvg-convert -w 144 -h 144 /tmp/icon_full.svg -o "$RES_DIR/mipmap-xxhdpi/ic_launcher.png"
          rsvg-convert -w 192 -h 192 /tmp/icon_full.svg -o "$RES_DIR/mipmap-xxxhdpi/ic_launcher.png"

          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp "$RES_DIR/$dir/ic_launcher.png" "$RES_DIR/$dir/ic_launcher_round.png"
          done

          rsvg-convert -w 108 -h 108 /tmp/icon_fg.svg -o "$RES_DIR/mipmap-mdpi/ic_launcher_foreground.png"
          rsvg-convert -w 162 -h 162 /tmp/icon_fg.svg -o "$RES_DIR/mipmap-hdpi/ic_launcher_foreground.png"
          rsvg-convert -w 216 -h 216 /tmp/icon_fg.svg -o "$RES_DIR/mipmap-xhdpi/ic_launcher_foreground.png"
          rsvg-convert -w 324 -h 324 /tmp/icon_fg.svg -o "$RES_DIR/mipmap-xxhdpi/ic_launcher_foreground.png"
          rsvg-convert -w 432 -h 432 /tmp/icon_fg.svg -o "$RES_DIR/mipmap-xxxhdpi/ic_launcher_foreground.png"

          mkdir -p "$RES_DIR/values" "$RES_DIR/mipmap-anydpi-v26"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#000000</color>\n</resources>\n' > "$RES_DIR/values/ic_launcher_background.xml"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n    <monochrome android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml"
          cp "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml" "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Kompajliranje Android APK datoteke
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Objava gotovog APK-a za preuzimanje
        uses: actions/upload-artifact@v4
        with:
          name: My-TV-Tracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
